risks:
  - risk: One person builds, designs, tests and pitches all of it.
    impact: high
    mitigation: >
      The ask is priced at what it costs to stop being one person. Until then,
      the tests are the second pair of eyes — 298 unit and 27 browser tests, run
      as separate steps after two commits went out on a chained command that
      hid a failure.
  - risk: Mobile plays worse than the keyboard and is now public.
    impact: medium
    mitigation: >
      Named as early everywhere it appears — the deck, the README, the FAQ — and
      scheduled after 1v1 as a design job rather than a tuning job.
  - risk: The name is not trademark-cleared.
    impact: medium
    mitigation: Budgeted in sprint 9, before any brand spend.
  - risk: Empty leaderboards in front of an audience.
    impact: low
    mitigation: Sprint 7.4, before the next demo.